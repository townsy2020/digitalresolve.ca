<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Camera Stream</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: #020617;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }
    #player-wrap {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      overflow: hidden;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
      display: block;
    }
    /* HUD Badges */
    .hud-badge-top {
      position: absolute;
      top: 10px;
      left: 10px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.4px;
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #94a3b8;
      z-index: 10;
      pointer-events: none;
    }
    .hud-badge-top.online {
      color: #a7f3d0;
      border-color: rgba(16, 185, 129, 0.5);
      background: rgba(6, 78, 59, 0.75);
    }
    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 6px #10b981;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(0.9); opacity: 0.7; }
      50% { transform: scale(1.3); opacity: 1; }
      100% { transform: scale(0.9); opacity: 0.7; }
    }
    .hud-bottom-bar {
      position: absolute;
      bottom: 8px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    #player-wrap:hover .hud-bottom-bar, #player-wrap:focus-within .hud-bottom-bar {
      opacity: 1;
    }
    .hud-btn {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #cbd5e1;
      padding: 4px 10px;
      border-radius: 5px;
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      backdrop-filter: blur(8px);
      transition: all 0.15s ease;
    }
    .hud-btn:hover {
      background: rgba(30, 41, 59, 0.95);
      border-color: rgba(255, 255, 255, 0.3);
      color: #fff;
    }
    .hud-btn.active {
      background: rgba(16, 185, 129, 0.25);
      border-color: #10b981;
      color: #6ee7b7;
    }
    /* Non-blocking Spinner */
    #loading-spinner {
      position: absolute;
      inset: 0;
      background: rgba(2, 6, 23, 0.92);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      z-index: 20;
      transition: opacity 0.25s ease;
    }
    .spin {
      width: 28px;
      height: 28px;
      border: 2px solid rgba(56, 189, 248, 0.2);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="player-wrap">
    <video id="video" autoplay playsinline muted></video>
    
    <div class="hud-badge-top" id="status-badge">
      <div class="pulse-dot"></div>
      <span id="status-text">CONNECTING...</span>
    </div>

    <div class="hud-bottom-bar">
      <div style="display: flex; gap: 6px;">
        <button type="button" class="hud-btn" id="btn-audio" onclick="toggleAudio()">
          &#128263; Audio
        </button>
        <button type="button" class="hud-btn" onclick="reconnect()">
          &#8635; Reload
        </button>
      </div>
      <div>
        <button type="button" class="hud-btn" onclick="toggleFullscreen()">
          &#9974; Fullscreen
        </button>
      </div>
    </div>

    <div id="loading-spinner">
      <div class="spin"></div>
      <div style="font-size: 0.82rem; font-weight: 600; color: #f1f5f9;">Connecting WebRTC Stream...</div>
      <div style="font-size: 0.7rem; color: #64748b; font-family: monospace;">Zero-Lag Hardware Accelerated</div>
    </div>
  </div>

  <script>
    const video = document.getElementById('video');
    const spinner = document.getElementById('loading-spinner');
    const statusBadge = document.getElementById('status-badge');
    const statusText = document.getElementById('status-text');
    const btnAudio = document.getElementById('btn-audio');

    let pc = null;
    let ws = null;
    let reconnectTimeout = null;

    function hideSpinner() {
      if (spinner && spinner.style.display !== 'none') {
        spinner.style.opacity = '0';
        setTimeout(() => { spinner.style.display = 'none'; }, 250);
      }
    }

    function toggleAudio() {
      video.muted = !video.muted;
      btnAudio.innerHTML = video.muted ? '&#128263; Audio' : '&#128266; Audio ON';
      btnAudio.classList.toggle('active', !video.muted);
    }

    function toggleFullscreen() {
      const wrap = document.getElementById('player-wrap');
      if (!document.fullscreenElement) {
        wrap.requestFullscreen().catch(err => console.warn(err));
      } else {
        document.exitFullscreen();
      }
    }

    function reconnect() {
      if (spinner) {
        spinner.style.display = 'flex';
        spinner.style.opacity = '1';
      }
      initWebRTC();
    }

    function initWebRTC() {
      if (reconnectTimeout) clearTimeout(reconnectTimeout);
      if (pc) { try { pc.close(); } catch(e){} }
      if (ws) { try { ws.close(); } catch(e){} }

      pc = new RTCPeerConnection({
        iceServers: [{ urls: ['stun:stun.cloudflare.com:3478', 'stun:stun.l.google.com:19302'] }]
      });

      const tracks = ['video', 'audio'].map(kind => pc.addTransceiver(kind, { direction: 'recvonly' }).receiver.track);
      video.srcObject = new MediaStream(tracks);

      pc.addEventListener('connectionstatechange', () => {
        if (pc.connectionState === 'connected') {
          hideSpinner();
          video.play().catch(e => console.warn('Auto-play suppressed:', e));
        }
        if (pc.connectionState === 'connected') {
          statusBadge.classList.add('online');
          statusText.textContent = 'LIVE WEBRTC';
          hideSpinner();
        } else if (pc.connectionState === 'failed' || pc.connectionState === 'disconnected') {
          statusBadge.classList.remove('online');
          statusText.textContent = 'RECONNECTING...';
          reconnectTimeout = setTimeout(initWebRTC, 3000);
        }
      });

      const params = new URLSearchParams(window.location.search);
      const src = params.get('src') || 'pennys_feeder';
      const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      let wsHost = window.location.host;
      if (window.location.hostname === 'digitalresolve.ca' || window.location.hostname.endsWith('github.io') || window.location.protocol === 'file:' || window.location.hostname === 'localhost') {
        wsHost = 'cam.digitalresolve.ca';
      }
      const wsUrl = `${proto}//${wsHost}/api/ws?src=${encodeURIComponent(src)}`;

      ws = new WebSocket(wsUrl);

      ws.addEventListener('open', () => {
        pc.addEventListener('icecandidate', ev => {
          if (!ev.candidate || ws.readyState !== WebSocket.OPEN) return;
          ws.send(JSON.stringify({ type: 'webrtc/candidate', value: ev.candidate.candidate }));
        });

        pc.createOffer().then(offer => pc.setLocalDescription(offer)).then(() => {
          if (ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ type: 'webrtc/offer', value: pc.localDescription.sdp }));
          }
        });
      });

      ws.addEventListener('message', ev => {
        try {
          const msg = JSON.parse(ev.data);
          if (msg.type === 'webrtc/candidate') {
            pc.addIceCandidate({ candidate: msg.value, sdpMid: '0' });
          } else if (msg.type === 'webrtc/answer') {
            pc.setRemoteDescription({ type: 'answer', sdp: msg.value });
          }
        } catch (e) {}
      });

      ws.addEventListener('close', () => {
        statusBadge.classList.remove('online');
        statusText.textContent = 'DISCONNECTED';
      });

      ws.addEventListener('error', () => {
        statusBadge.classList.remove('online');
        statusText.textContent = 'AUTH / GATEWAY REQUIRED';
        hideSpinner();
      });

      video.addEventListener('loadeddata', hideSpinner);
      video.addEventListener('playing', hideSpinner);
      setTimeout(hideSpinner, 3500);
    }

    window.addEventListener('DOMContentLoaded', initWebRTC);
  </script>
</body>
</html>
